name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Chave usada apenas nos testes/CI. Nao usar em producao.
  SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.9

      - name: Run ruff check
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing

  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///./ci_migrations.db
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations (upgrade head)
        run: alembic upgrade head

      - name: Show current revision
        run: alembic current

      - name: Check for migration drift
        run: alembic check

      - name: Downgrade to base
        run: alembic downgrade base

      - name: Re-apply migrations
        run: alembic upgrade head

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build image
        run: docker build -f dockerfile -t medsync-api:ci .

      - name: Smoke test API
        run: |
          docker run -d --name medsync-api -p 8000:8000 \
            -e SECRET_KEY="$SECRET_KEY" \
            -e DATABASE_URL=sqlite:////tmp/medsync.db \
            medsync-api:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ ; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done

          echo "::error::API did not respond in time"
          docker logs medsync-api
          exit 1
